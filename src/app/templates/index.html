<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 開発環境チェック</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #f6f8fa; color: #1f2328; margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; border-left: 6px solid #b8860b; padding-left: 10px; }
  section { background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 16px; margin: 16px 0; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .ok { color: #1a7f37; font-weight: 600; }
  .ng { color: #cf222e; font-weight: 600; }
  .mute { color: #59636e; font-size: .9rem; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #d1d9e0; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Python 開発環境チェック</h1>

  <section>
    <h2>Python</h2>
    <p class="ok">Python $python_version</p>
    <p class="mute">API の説明（自動生成）：<a href="/docs">/docs</a>　／　<a href="/api/health">/api/health</a></p>
  </section>

  <section>
    <h2>データベース（PostgreSQL）</h2>
    <p class="$db_class">$db_status</p>
    <p class="mute">$db_detail</p>
  </section>

  <section>
    <h2>メール</h2>
    <form method="post" action="/mail"><button type="submit">テストメールを送る</button></form>
    $mail_message
    <p class="mute">送ったメールは外部には出ず、<a href="http://localhost:8027">Mailpit</a>に届きます。</p>
  </section>

  <section>
    <h2>Claude API（要約のサンプル）</h2>
    <p class="$ai_class">$ai_status</p>
    <p class="mute">モデル：$model　／　試すときは <a href="/docs">/docs</a> の POST /api/summarize から</p>
  </section>
</main>
</body>
</html>
